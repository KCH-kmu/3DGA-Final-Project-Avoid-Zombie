[/Script/AIModule.CrowdManager]
; 좀비 AI는 Detour Crowd(UCrowdFollowingComponent)로 이동한다. 크라우드 매니저가
; 동시에 시뮬레이션할 수 있는 에이전트 수는 MaxAgents(엔진 기본값 50)로 제한된다.
; 슬롯이 꽉 차면(좀비 누적 + 플레이어 회피 에이전트 1) 초과분 좀비는 크라우드에
; '등록은 됐다'고 표시되지만 실제 detour 슬롯을 못 받아 이동 속도를 전혀 못 받는다
; → 제자리에 멈춤. (공격은 AIController의 별도 타이머라 계속 작동 → "공격은 하는데
; 이동은 안 함" 증상.) 좀비가 많이 쌓여도 전부 움직이도록 상한을 크게 올린다.
; 미사용 슬롯은 매 프레임 비용이 없으므로(시뮬 비용은 실제 활성 에이전트 수에만 비례)
; 상한을 높여도 평상시 성능엔 영향이 없다.
MaxAgents=256

